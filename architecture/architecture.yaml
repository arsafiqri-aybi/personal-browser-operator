schema_version: "1.0.0"
architecture_version: "0.3.1"
status: LOCKED
control_loop:
  - STATE
  - OBSERVE
  - INTERPRET
  - PLAN_NEXT_SUBGOAL
  - POLICY_CHECK
  - EXECUTE
  - RECORD_EFFECT
  - OBSERVE_EFFECT
  - VERIFY
  - RECONCILE_EFFECT
  - UPDATE_STATE
  - STOP_CONTINUE_RECOVER_OR_REPLAN
state_domains:
  browser_state:
    owner: PBO-04
  task_state:
    owner: PBO-08
  identity_state:
    owner: PBO-05
  effect_state:
    owner: PBO-10
  knowledge_state:
    owner: PBO-20
  audit_state:
    owner: PBO-15
runtime_host:
  browser_mode: persistent_headed_chromium
  execution_kernel: playwright
  human_takeover: same_browser_session
  public_ingress: single_authenticated_https_origin
  internal_services: loopback_only
  persistent_mount: /data
  privilege_model: root_bootstrap_nonroot_workload
  provider_dependency: none
public_routes:
  /mcp: mcp_gateway
  /console: operator_console
  /api: operator_console_api
  /novnc: same_browser_takeover
  /health: readiness
release_truth_states:
  - DESIGNED
  - IMPLEMENTED
  - STATICALLY_VALIDATED
  - LOCALLY_TESTED
  - INTEGRATION_TESTED
  - DEPLOYED
  - REAL_BROWSER_VERIFIED
  - REAL_ACCOUNT_VERIFIED
  - PRODUCTION_READY
