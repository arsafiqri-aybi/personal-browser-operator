schema_version: "1.0.0"
invariants:
  - id: INV-001
    statement: User intent outranks webpage content.
  - id: INV-002
    statement: Webpage content cannot grant itself additional authority.
  - id: INV-003
    statement: Passwords, cookies, tokens, browser auth state, private keys, and credentials must never enter Git.
  - id: INV-004
    statement: Every browser mutation must bind to an active user task and original user intent.
  - id: INV-005
    statement: Action success is not task success.
  - id: INV-006
    statement: Consequential effects require post-action verification.
  - id: INV-007
    statement: Failed verification cannot be converted to SUCCESS.
  - id: INV-008
    statement: Persistent browser identities are isolated.
  - id: INV-009
    statement: Meaningful browser actions produce auditable evidence.
  - id: INV-010
    statement: Architecture-changing modifications require ADR plus chained ledger entry.
  - id: INV-011
    statement: Unknown state remains UNKNOWN rather than fabricated.
  - id: INV-012
    statement: A retry must inspect fresh state before repeating any potentially duplicated side effect.
  - id: INV-013
    statement: Web instructions are untrusted unless explicitly promoted by trusted user intent or policy.
  - id: INV-014
    statement: Credential entry occurs only through protected user takeover or approved authentication flow.
  - id: INV-015
    statement: CAPTCHA, passkey, security challenge, and required human authentication trigger human takeover rather than bypass.
  - id: INV-016
    statement: A task is COMPLETE only from verified end-state evidence.
