schema_version: "1.0.0"
modules:
  - {id: PBO-01, name: MCP Gateway, purpose: "Expose compact semantic MCP tools and enforce schemas.", owner: runtime, inputs: [mcp_requests], outputs: [validated_commands], dependencies: [], trust_boundary: control_plane, state_owner: none, side_effects: none, failure_modes: [invalid_schema, transport_failure], verification: contract_tests, protected_invariants: [INV-001, INV-002, INV-009]}
  - {id: PBO-02, name: Intent and Task Contract, purpose: "Bind user goals to durable executable contracts.", owner: runtime, inputs: [validated_commands], outputs: [task_contract], dependencies: [PBO-01], trust_boundary: control_plane, state_owner: task_contract, side_effects: none, failure_modes: [ambiguous_goal, invalid_revision], verification: schema_and_revision_tests, protected_invariants: [INV-001, INV-004, INV-010]}
  - {id: PBO-03, name: Durable Task State, purpose: "Persist current goal, progress, evidence, blockers, and next action.", owner: runtime, inputs: [task_contract, events], outputs: [task_state], dependencies: [PBO-02], trust_boundary: control_plane, state_owner: task_state, side_effects: state_write, failure_modes: [stale_state, state_corruption], verification: state_transition_tests, protected_invariants: [INV-011, INV-016]}
  - {id: PBO-04, name: Browser Lifecycle Manager, purpose: "Own browser process, context, pages and lifecycle.", owner: browser, inputs: [session_commands], outputs: [browser_state], dependencies: [PBO-03], trust_boundary: execution_boundary, state_owner: browser_state, side_effects: browser_process, failure_modes: [browser_crash, context_conflict], verification: lifecycle_integration_tests, protected_invariants: [INV-008]}
  - {id: PBO-05, name: Identity Session Vault, purpose: "Isolate and protect persistent authenticated identities.", owner: security, inputs: [identity_commands], outputs: [identity_handle], dependencies: [PBO-04], trust_boundary: secret_boundary, state_owner: identity_state, side_effects: encrypted_state_write, failure_modes: [auth_expired, vault_unavailable, profile_conflict], verification: isolation_and_secret_tests, protected_invariants: [INV-003, INV-008, INV-014, INV-015]}
  - {id: PBO-06, name: Observation Engine, purpose: "Produce minimal structured snapshots of current browser state.", owner: browser, inputs: [browser_state], outputs: [observation], dependencies: [PBO-04], trust_boundary: data_plane, state_owner: observation_state, side_effects: none, failure_modes: [snapshot_failure, unsupported_surface], verification: observation_contract_tests, protected_invariants: [INV-011]}
  - {id: PBO-07, name: Grounding Engine, purpose: "Resolve semantic targets to stable page references.", owner: browser, inputs: [observation, target_intent], outputs: [grounded_target], dependencies: [PBO-06], trust_boundary: data_to_control_guard, state_owner: none, side_effects: none, failure_modes: [target_not_found, ambiguous_target, stale_reference], verification: grounding_tests, protected_invariants: [INV-002, INV-011]}
  - {id: PBO-08, name: Planner Interface, purpose: "Represent next subgoal and decision rationale without storing hidden chain of thought.", owner: runtime, inputs: [task_state, observation], outputs: [action_proposal], dependencies: [PBO-02, PBO-03], trust_boundary: control_plane, state_owner: plan_state, side_effects: none, failure_modes: [goal_drift, unsupported_plan], verification: task_alignment_tests, protected_invariants: [INV-001, INV-004, INV-013]}
  - {id: PBO-09, name: Action Policy Engine, purpose: "Bind task intent, identity, domain and risk before mutation.", owner: security, inputs: [action_proposal, identity_state], outputs: [authorized_action], dependencies: [PBO-02, PBO-05, PBO-08], trust_boundary: privileged_boundary, state_owner: policy_state, side_effects: approval_state, failure_modes: [policy_denied, unknown_authority], verification: risk_and_permission_tests, protected_invariants: [INV-004, INV-007, INV-013]}
  - {id: PBO-10, name: Playwright Execution Kernel, purpose: "Execute bounded browser actions using Playwright semantics.", owner: browser, inputs: [authorized_action, grounded_target], outputs: [action_result], dependencies: [PBO-04, PBO-07, PBO-09], trust_boundary: privileged_boundary, state_owner: none, side_effects: web_mutation, failure_modes: [timeout, navigation_changed, partial_effect], verification: playwright_integration_tests, protected_invariants: [INV-004, INV-012]}
  - {id: PBO-11, name: Verification Engine, purpose: "Compare expected effects to observed effects and end-state criteria.", owner: verification, inputs: [action_result, observation, task_state], outputs: [verification], dependencies: [PBO-06, PBO-08, PBO-10], trust_boundary: verification_boundary, state_owner: verification_state, side_effects: none, failure_modes: [insufficient_evidence, conflicting_evidence], verification: verifier_tests, protected_invariants: [INV-005, INV-006, INV-007, INV-016]}
  - {id: PBO-12, name: Recovery Replanning Engine, purpose: "Diagnose failures and recover without duplicate side effects.", owner: runtime, inputs: [failure, current_state, verification], outputs: [recovery_decision], dependencies: [PBO-10, PBO-11], trust_boundary: control_plane, state_owner: recovery_state, side_effects: none, failure_modes: [retry_exhausted, ambiguous_partial_effect], verification: failure_injection_tests, protected_invariants: [INV-007, INV-012]}
  - {id: PBO-13, name: Instruction Firewall, purpose: "Prevent data-plane content from gaining control-plane authority.", owner: security, inputs: [web_content, action_proposal], outputs: [sanitized_evidence, policy_signal], dependencies: [PBO-01, PBO-09, PBO-10, PBO-12], trust_boundary: data_to_control_guard, state_owner: none, side_effects: none, failure_modes: [injection_detected, ambiguous_authority], verification: adversarial_tests, protected_invariants: [INV-001, INV-002, INV-013]}
  - {id: PBO-14, name: Audit Provenance Ledger, purpose: "Record reconstructable observable evidence and decisions.", owner: governance, inputs: [runtime_events], outputs: [audit_entries], dependencies: [PBO-02, PBO-03], trust_boundary: audit_boundary, state_owner: audit_state, side_effects: append_only_log, failure_modes: [audit_write_failure, chain_mismatch], verification: ledger_tests, protected_invariants: [INV-009, INV-010]}
  - {id: PBO-15, name: Artifact Download Manager, purpose: "Handle uploads/downloads with policy and provenance.", owner: runtime, inputs: [artifact_request], outputs: [artifact_ref], dependencies: [PBO-10, PBO-14], trust_boundary: file_boundary, state_owner: artifact_state, side_effects: file_io, failure_modes: [unsafe_file, download_failure], verification: artifact_security_tests, protected_invariants: [INV-004, INV-009]}
  - {id: PBO-16, name: Human Takeover, purpose: "Pause automation for protected human-only steps then reverify.", owner: runtime, inputs: [takeover_request], outputs: [resume_state], dependencies: [PBO-10], trust_boundary: human_boundary, state_owner: takeover_state, side_effects: user_control, failure_modes: [resume_state_unknown], verification: takeover_tests, protected_invariants: [INV-014, INV-015]}
  - {id: PBO-17, name: Live Browser Console, purpose: "Expose viewport, task state, audit and stop/takeover controls.", owner: ui, inputs: [browser_state, task_state, audit_state], outputs: [operator_ui], dependencies: [PBO-03, PBO-04, PBO-14, PBO-16], trust_boundary: user_boundary, state_owner: ui_state, side_effects: user_commands, failure_modes: [stale_ui], verification: ui_state_tests, protected_invariants: [INV-009]}
  - {id: PBO-18, name: Persistence Checkpointing, purpose: "Persist recoverable task/browser metadata and last-known-good checkpoints.", owner: runtime, inputs: [state_domains], outputs: [checkpoint], dependencies: [PBO-05, PBO-08, PBO-10, PBO-14], trust_boundary: persistence_boundary, state_owner: checkpoint_state, side_effects: state_write, failure_modes: [checkpoint_corruption], verification: restart_recovery_tests, protected_invariants: [INV-011, INV-016]}
  - {id: PBO-19, name: Telemetry Diagnostics, purpose: "Provide privacy-aware health, failures and readiness.", owner: operations, inputs: [runtime_metrics], outputs: [diagnostics], dependencies: [PBO-01, PBO-14, PBO-18], trust_boundary: observability_boundary, state_owner: telemetry_state, side_effects: metrics_write, failure_modes: [telemetry_unavailable], verification: ops_tests, protected_invariants: [INV-003]}
  - {id: PBO-20, name: Evaluation Regression System, purpose: "Prove contracts, workflows, adversarial safety, regressions and release gates.", owner: verification, inputs: [all_modules], outputs: [evidence_bundle], dependencies: [PBO-01, PBO-02, PBO-04, PBO-05, PBO-06, PBO-07, PBO-08, PBO-09, PBO-10, PBO-11, PBO-12, PBO-13, PBO-14, PBO-15, PBO-16, PBO-17, PBO-18, PBO-19, PBO-21, PBO-22], trust_boundary: verification_boundary, state_owner: regression_memory, side_effects: test_artifacts, failure_modes: [false_pass, incomplete_coverage], verification: meta_evaluation, protected_invariants: [INV-005, INV-006, INV-007, INV-016]}
  - {id: PBO-21, name: Secure Mobile Relay, purpose: "Broker authenticated short-lived commands between the MCP control plane and one outbound-connected Android device without exposing the phone directly.", owner: runtime, inputs: [authorized_mobile_command, device_websocket], outputs: [relayed_command, device_response, connectivity_state], dependencies: [PBO-01, PBO-09, PBO-14], trust_boundary: execution_boundary, state_owner: relay_connection_state, side_effects: network_message, failure_modes: [device_offline, relay_timeout, unauthorized_device, unauthorized_control], verification: relay_auth_and_timeout_tests, protected_invariants: [INV-003, INV-004, INV-009, INV-012]}
  - {id: PBO-22, name: Android Accessibility Execution Kernel, purpose: "Observe and perform bounded Android UI actions using AccessibilityService with ephemeral state-bound refs and explicit approval for sensitive input.", owner: mobile, inputs: [relayed_command], outputs: [mobile_observation, action_result], dependencies: [PBO-09, PBO-21], trust_boundary: privileged_boundary, state_owner: mobile_ui_state, side_effects: device_ui_mutation, failure_modes: [stale_state, target_not_found, permission_disabled, action_not_performed, sensitive_input_denied], verification: android_agent_contract_tests, protected_invariants: [INV-004, INV-006, INV-011, INV-012, INV-014, INV-015]}
